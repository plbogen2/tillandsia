name: Export STLs

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Allows manual triggering

jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for release trigger
        id: check-release
        shell: bash
        run: |
          msg="${{ github.event.head_commit.message }}"
          if [[ "$msg" =~ \[rel:[[:space:]]*(v[0-9]+\.[0-9]+\.[0-9]+)\] ]]; then
            echo "RELEASE=true" >> "$GITHUB_OUTPUT"
            echo "TAG_NAME=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          elif [[ "$msg" =~ \[rel\] ]]; then
            echo "RELEASE=true" >> "$GITHUB_OUTPUT"
            echo "TAG_NAME=v${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          else
            echo "RELEASE=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install OpenSCAD (Nightly) and ffmpeg
        run: |
          wget -qO- https://files.openscad.org/OBS-Repository-Key.pub | sudo tee /etc/apt/trusted.gpg.d/obs-openscad-nightly.asc
          echo "deb https://download.opensuse.org/repositories/home:/t-paul/xUbuntu_24.04/ ./" | sudo tee /etc/apt/sources.list.d/openscad.list
          sudo apt-get update
          sudo apt-get install -y openscad-nightly ffmpeg

      - name: Create symlink for openscad
        run: sudo ln -s /usr/bin/openscad-nightly /usr/local/bin/openscad

      - name: Run Export Script
        shell: pwsh
        run: ./export.ps1 -RenderPng -RenderGif

      - name: Upload STLs as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Aeropress-Desk-Cleaner-STLs
          path: STLs/*.stl

      - name: Upload PNG Previews
        uses: actions/upload-artifact@v4
        with:
          name: Aeropress-Desk-Cleaner-PNGs
          path: PNGs/*.png

      - name: Upload Animation GIF
        uses: actions/upload-artifact@v4
        with:
          name: Aeropress-Desk-Cleaner-Animation
          path: Animation/*.gif

      - name: Commit Generated Files to Repo
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add -f STLs/ PNGs/ Animation/
          
          CHANGES_COMMITTED=false
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "chore: auto-generate STLs, PNGs, and GIF [skip ci]"
            CHANGES_COMMITTED=true
          fi
          
          if [ "$CHANGES_COMMITTED" = "true" ]; then
            git push origin main
          fi
          
          if [ "${{ steps.check-release.outputs.RELEASE }}" = "true" ]; then
            git tag ${{ steps.check-release.outputs.TAG_NAME }}
            git push origin ${{ steps.check-release.outputs.TAG_NAME }}
          fi

      - name: Create Release Archive
        if: steps.check-release.outputs.RELEASE == 'true'
        run: |
          echo "=== Listing files ==="
          ls -la
          ls -la STLs/
          ls -la Animation/
          echo "=== Creating zip ==="
          zip release.zip STLs/*.stl *.scad Animation/*.gif
          echo "=== Verifying zip ==="
          unzip -l release.zip

      - name: Create GitHub Release
        if: steps.check-release.outputs.RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.check-release.outputs.TAG_NAME }}
          files: release.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
